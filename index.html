<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SwitchOn — a project management dashboard for tracking projects, tasks, deadlines and team workload."
    />
    <title>SwitchOn · Project Management Dashboard</title>
    <script>
      // Applies the saved (or system) theme before first paint, so a dark-mode
      // visitor never sees a flash of the light theme while React boots.
      ;(function () {
        try {
          var saved = localStorage.getItem('switchon.theme.v1')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          /* Storage blocked — React will apply the theme on mount instead. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
